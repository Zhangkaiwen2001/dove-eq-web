services:
  backend:
    build: ./backend
    container_name: dove-eq-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro

  frontend:
    build: ./frontend
    container_name: dove-eq-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
